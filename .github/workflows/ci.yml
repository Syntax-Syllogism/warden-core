# warden-core CI Pipeline
#
# Runs deterministic checks on every pull request and push to master.

name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  ci:
    name: CI Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # typecheck + lint + prettier + mocha with c8 coverage thresholds
      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm run pack:check
