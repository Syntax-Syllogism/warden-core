# Publishes to npm when the private release process pushes the `release` branch.
# Uses npm provenance (OIDC) — no NPM_TOKEN secret required if the package is
# configured for trusted publishing; otherwise add NPM_TOKEN and a
# `- run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc` step.
name: Publish to npm

on:
  push:
    branches: [release]

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    # The release branch is pushed to both the private origin and the public
    # mirror, so without this guard the private repository also tries to
    # publish and fails on every release — it has no trusted-publisher claim,
    # and the version has already been taken by the mirror's successful run.
    if: github.repository == 'Syntax-Syllogism/warden-core'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Verify package contents
        run: npm run pack:check

      # Bootstrap: the first publish authenticates with NPM_TOKEN because npm
      # trusted publishing can only be configured once the package exists.
      # Remove this env block (and the secret) once the trusted publisher is
      # set up; see the first-time npm publish runbook.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
