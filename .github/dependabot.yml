version: 2
updates:
  # Keep this scoped to the project root. docs-site is intentionally excluded:
  # docs-theme is private and Dependabot has a separate secrets store.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # The test/lint toolchain is pinned to match the warden plugin so tests
    # move between the repos unchanged; upgrade these majors deliberately,
    # in both repos at once. @types/node tracks the `engines` floor (22).
    ignore:
      - dependency-name: 'mocha'
        update-types: ['version-update:semver-major']
      - dependency-name: 'sinon'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/sinon'
        update-types: ['version-update:semver-major']
      - dependency-name: 'chai'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/chai'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-salesforce-typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prettier'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
